# Cloudflare Pages 설정.
# 이 파일은 Pages Functions 의 binding/secret/compat 정의의 IaC 진실 원천.
#
# 주의:
# - Pages 프로젝트는 대시보드 또는 wrangler.toml 둘 중 한 곳에서만 binding 관리.
#   둘 다 있으면 wrangler.toml 이 다음 배포에서 덮어쓰니, 본 파일이 정답이라고 보면 됨.
# - Secrets 는 wrangler.toml 에 적지 않음. CF Pages → Settings → Variables and Secrets
#   에 Type=Secret 으로 등록하고, 런타임에서 `env.SUPABASE_SECRET_KEY` 처럼 읽음.

name = "stunning-tribble"
compatibility_date = "2026-04-27"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# ── R2 binding ──
# 모델 reference 이미지, 생성된 모델샷 6컷, 상세페이지 1장 모두 이 버킷에 저장.
# Public access 는 r2.dev 서브도메인 또는 (베타 후) custom domain 으로 노출.
# Pages Functions 에서 `env.IMAGES_BUCKET` 으로 접근 (R/W).
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "fashion-saas-images"

# ── Queues (Sprint 2 에서 활성화) ──
# 도매처 크롤링 큐 + OpenAI Images 생성 큐 분리 예정.
# [[queues.producers]]
# binding = "GENERATE_QUEUE"
# queue   = "fashion-saas-generate"
#
# [[queues.consumers]]
# queue          = "fashion-saas-generate"
# max_batch_size = 1

# ── Vars (Plaintext 환경변수) ──
# 2026 년 CF Pages 정책 변경: 대시보드는 Secret 만 관리, Plaintext 는 wrangler.toml 이 진실 원천.
# 따라서 비밀 아닌 모든 환경변수는 여기에 박는다. 변경 시 코드와 함께 PR 로 추적됨.
#
# Production / Preview 환경 분리 필요 시:
#   [env.production.vars] / [env.preview.vars] 두 섹션으로 쪼개고 [vars] 제거.
# v1: 동일 Supabase 프로젝트 + 동일 R2 버킷 사용 → 단일 [vars] 로 충분.
[vars]
NODE_VERSION = "20"

# 프론트(Vite) — VITE_ prefix 변수는 빌드 시 클라이언트 번들에 박힘.
# Publishable key 는 RLS 로 보호되는 공개 키라 노출 OK.
VITE_SUPABASE_URL = "https://fkyaazenwjneeonwyyuj.supabase.co"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IxLlFrICvwwhwso_92BEzQ_sH707NQ9"

# 서버 (Pages Functions). Secret 이 아닌 것만.
SUPABASE_URL = "https://fkyaazenwjneeonwyyuj.supabase.co"
R2_PUBLIC_HOST = "https://pub-0b51813ff386490c83b3a5d49a1ff369.r2.dev"

# Secret 은 여기 적지 않음. CF Pages → Settings → Variables and Secrets:
#   - SUPABASE_SECRET_KEY  (등록됨)
#   - OPENAI_API_KEY       (저녁 PoC 전 등록 필요)
